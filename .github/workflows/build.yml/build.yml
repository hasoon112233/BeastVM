name: Beast VM Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Download source
      run: |
        curl -fSL -o beast-vm.tar.gz "https://muse.ai/files/1309900792215384/1101767065923641/o1855a2fqkhb0v5x508myir1/beast-vm.tar.gz"
        tar -xzf beast-vm.tar.gz
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x vectras-beast/gradlew
    - name: Build Debug APK
      run: |
        cd vectras-beast
        ./gradlew assembleDebug --no-daemon
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: beast-vm-apk
        path: vectras-beast/app/build/outputs/apk/debug/app-debug.apk
    - name: Publish to Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: beast-vm
        files: vectras-beast/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
